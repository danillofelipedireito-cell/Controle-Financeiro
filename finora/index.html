function events(){

  for(const r of rows('income')){const paid=receivedTotal(r.id),initial=Math.max(0,n(r.receivedAmount));const amt=Math.max(0,n(r.amount));if(initial&&r.receivedDate)out.push({date:r.receivedDate,amount:initial,kind:'income',actual:true,group:null,name:r.name});if(amt>paid&&r.expectedDate)out.push({date:r.expectedDate,amount:amt-paid,kind:'income',actual:false,name:r.name})}

  for(const r of rows('income_receipt')){const p=rows('income').find(x=>x.id===r.parentId);if(p)out.push({date:r.date,amount:n(r.amount),kind:'income',actual:true,name:p.name})}
  for(const r of rows('expense_payment')){const p=rows('expense').find(x=>x.id===r.parentId);if(p)out.push({date:r.date,amount:-n(r.amount),kind:'expense',actual:true,group:p.allocation||'needs',name:p.item})}
  for(const r of rows('debt_payment')){out.push({date:r.date,amount:-Math.max(0,n(r.amount)),kind:'debt',actual:true,group:'needs',name:'Pagamento de dívida'})}
  const totals={};rows('debt_payment').forEach(x=>totals[x.installmentId]=(totals[x.installmentId]||0)+n(x.amount));
  for(const r of rows('installment')){const remain=Math.max(0,Math.round((n(r.amount)-(totals[r.id]||0))*100)/100);if(remain>0)out.push({date:r.dueDate,amount:-remain,kind:'debt',actual:false,group:'needs',name:rows('debt').find(x=>x.id===r.debtId)?.name||'Parcela'})}
  for(const r of rows('investment_op'))out.push({date:r.date,amount:n(r.amount)*(r.action==='resgate'?1:-1),kind:'invest',actual:true,group:'save',name:r.action==='resgate'?'Resgate':'Aporte'});
  return out.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));
}

function makeInstallments(debt){const amountCents=Math.round(n(debt.amount)*100),count=Math.round(n(debt.installmentCount)),base=Math.floor(amountCents/count),remainder=amountCents-base*count;return Array.from({length:count},(_,i)=>({id:uid(),kind:'installment',debtId:debt.id,number:i+1,amount:(base+(i<remainder?1:0))/100,dueDate:addMonth(debt.firstDue,i)}))}
async function submitRecord(form){const kind=form.dataset.kind,id=form.dataset.id,prev=id?S.records.find(x=>x.id===id):null,v=getFormData(form),rec={...prev,...v,id:id||uid(),kind};
  const numericFields={income:['amount','receivedAmount'],expense:['amount','paidAmount'],debt:['amount','installmentCount'],investment:['invested','current']};(numericFields[kind]||[]).forEach(x=>rec[x]=n(rec[x]));
  if(!rec.amount&&['income','expense','debt'].includes(kind))throw Error('Informe um valor superior a zero.');
  if(kind==='income'&&(rec.receivedAmount<0||rec.receivedAmount+rows('income_receipt').filter(x=>x.parentId===rec.id).reduce((s,x)=>s+n(x.amount),0)>rec.amount))throw Error('Valor recebido deve estar entre zero e o previsto.');
  if(kind==='expense'&&(rec.paidAmount<0||rec.paidAmount+rows('expense_payment').filter(x=>x.parentId===rec.id).reduce((s,x)=>s+n(x.amount),0)>rec.amount))throw Error('Valor pago deve estar entre zero e o devido.');
  if(kind==='debt'&&(rec.installmentCount<1||rec.installmentCount>600||!Number.isInteger(rec.installmentCount)))throw Error('Informe de 1 a 600 parcelas.');
  if(kind==='investment'&&(rec.invested<0||rec.current<0))throw Error('Valores de investimento não podem ser negativos.');
  if(kind==='income'&&rec.receivedAmount>0&&!rec.receivedDate)throw Error('Informe a data do valor recebido.');
  if(kind==='expense'&&rec.paidAmount>0&&!rec.paidDate)throw Error('Informe a data do pagamento.');
  if(kind==='debt'){
    const oldInst=rows('installment').filter(x=>x.debtId===rec.id),hasPayments=rows('debt_payment').some(x=>x.debtId===rec.id),changed=prev&&(n(prev.amount)!==n(rec.amount)||n(prev.installmentCount)!==n(rec.installmentCount)||prev.firstDue!==rec.firstDue);
    if(changed&&hasPayments)throw Error('Há pagamentos lançados. Não é possível alterar valor, parcelas ou primeiro vencimento.');
    if(changed&&oldInst.length)await removeMany(oldInst.map(x=>x.id));
    await putMany([rec,...(!prev||changed?makeInstallments(rec):[])]);
  }else{
    const repeat=!prev&&rec.frequency==='Mensal (12 meses)',times=repeat?12:1;
    let batch=Array.from({length:times},(_,i)=>{const r={...rec,id:i?uid():rec.id};if(i){if(kind==='income'){r.expectedDate=addMonth(rec.expectedDate,i);r.receivedAmount=0;r.receivedDate=''}if(kind==='expense'){r.date=addMonth(rec.date,i);r.dueDate=addMonth(rec.dueDate,i);r.paidAmount=0;r.paidDate=''}}delete r.frequency;return r});
    if(kind==='investment'&&prev){const deltaPrincipal=n(rec.invested)-n(prev.invested);if(Math.abs(deltaPrincipal)>.001)throw Error('Para alterar capital aplicado, utilize Movimentar: Aporte ou Resgate.');}
    await putMany(batch);
  }
  closeModal();
}

function exportCSV(kind){const list=kind==='all'?S.records.filter(x=>x.kind!=='settings'):rows(kind);const fields=[...new Set(list.flatMap(x=>Object.keys(x)))];const csv='\ufeff'+[fields.join(';'),...list.map(x=>fields.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(';'))].join('\r\n');downloadFile(`finora-${kind}-${today()}.csv`,csv,'text/csv;charset=utf-8')}
function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportBackup(){downloadFile(`finora-backup-${today()}.json`,JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),workspace:currentWorkspace().name,records:S.records,settings:settings()},null,2),'application/json')}
async function submitSettings(form){const v=getFormData(form),a=n(v.needs),b=n(v.wants),c=n(v.save);if(Math.abs(a+b+c-100)>.001)throw Error('A soma dos percentuais deve ser 100%.');const old=rows('settings')[0]||{id:uid(),kind:'settings'};await putMany([{...old,openingBalance:n(v.openingBalance),openingDate:v.openingDate,needs:a,wants:b,save:c,dark:v.dark==='true'}]);S._settings=defaultSettings();render();toast('Preferências atualizadas.')}
async function authSubmit(form){const v=getFormData(form),sb=S.supabase;let err;if(S.authForm==='login'){({error:err}=await sb.auth.signInWithPassword({email:v.email,password:v.password}))}else if(S.authForm==='register'){({error:err}=await sb.auth.signUp({email:v.email,password:v.password,options:{data:{name:v.name},emailRedirectTo:location.origin+location.pathname}}))}else{({error:err}=await sb.auth.resetPasswordForEmail(v.email,{redirectTo:location.origin+location.pathname}))}if(err)throw err;toast(S.authForm==='login'?'Login realizado.':'Confira sua caixa de entrada para continuar.');if(S.authForm==='register'||S.authForm==='reset'){S.authForm='login';render()}}
async function createWorkspace(){const name=prompt('Nome do novo grupo financeiro (ex.: Família):');if(!name||!name.trim())return;if(name.length>80)throw Error('O nome deve ter até 80 caracteres.');const {data,error}=await S.supabase.from('workspaces').insert({name:name.trim(),kind:'shared',owner_id:S.user.id}).select('id').single();if(error)throw error;await loadCloud();await switchWorkspace(data.id);toast('Grupo criado. O código de convite está nas configurações.')}
async function joinWorkspace(){const code=prompt('Digite o código de convite recebido:');if(!code||!code.trim())return;const {data,error}=await S.supabase.rpc('join_workspace_by_code',{p_code:code.trim().toLowerCase()});if(error)throw error;await loadCloud();await switchWorkspace(data);toast('Você ingressou no grupo.')}

async function manageMembers(){if(!S.cloud||currentWorkspace().role!=='owner')return;const {data,error}=await S.supabase.rpc('finora_list_members',{p_workspace:S.active});if(error)throw error;
  const content=table(['Membro','Permissão','Ações'],(data||[]).map(x=>`<tr><td><div class="row-title">${esc(x.email)}</div><div class="row-sub">${esc(x.user_id)}</div></td><td>${tag(x.role)}</td><td>${x.role==='owner'?'Proprietário':`${button(x.role==='viewer'?'Tornar editor':'Tornar visualizador','member-role','btn secondary sm',`data-user="${x.user_id}" data-role="${x.role==='viewer'?'editor':'viewer'}"`)} ${button('Remover','member-remove','btn red sm',`data-user="${x.user_id}"`)}`}</td></tr>`).join(''));
  openModal('Membros do grupo',`<p class="helper">O editor pode registrar dados. O visualizador pode apenas consultar.</p>${content}`,'none');
}

async function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(b.tagName==='A')e.preventDefault();if(action==='close-modal'){if(e.target===b||b.classList.contains('modal-close')||b.textContent==='Cancelar')closeModal();return}
try{
 if(action==='goto'){S.page=b.dataset.page;S.search='';S.mobile=false;render();return}
 if(action==='menu'){S.mobile=!S.mobile;render();return}
 if(action==='close-menu'){S.mobile=false;render();return}
 if(action==='new'){recordForm(b.dataset.kind);return}
 if(action==='edit'){recordForm(b.dataset.kind,b.dataset.id);return}
 if(action==='details'){debtDetails(b.dataset.id);return}
 if(['pay-installment','pay-expense','receive','invest-op'].includes(action)){smallForm(action,b.dataset.id);return}
 if(action==='delete'){await deleteThing(b.dataset.kind,b.dataset.id);return}
 if(action==='csv'){exportCSV(b.dataset.kind);return}
 if(action==='backup'){exportBackup();return}
 if(action==='horizon'){S.horizon=n(b.dataset.n);render();return}
 if(action==='auth-switch'){S.authForm=b.dataset.to;render();return}
 if(action==='use-local'){useLocal();return}
 if(action==='enable-cloud'){localStorage.setItem('finora-mode','auto');S.mode='auto';await initialize();return}
 if(action==='logout'){await S.supabase.auth.signOut();S.user=null;S.records=[];render();return}
 if(action==='create-workspace'){await createWorkspace();return}
 if(action==='join-workspace'){await joinWorkspace();return}
 if(action==='manage-members'){await manageMembers();return}
 if(action==='member-role'){const {error}=await S.supabase.rpc('finora_set_member_role',{p_workspace:S.active,p_user:b.dataset.user,p_role:b.dataset.role});if(error)throw error;await manageMembers();toast('Permissão alterada.');return}
 if(action==='member-remove'){if(!confirm('Remover esta pessoa do grupo?'))return;const {error}=await S.supabase.rpc('finora_remove_member',{p_workspace:S.active,p_user:b.dataset.user});if(error)throw error;await manageMembers();toast('Participante removido.');return}
 if(action==='clear-local'){if(confirm('ATENÇÃO: excluir TODOS os registros deste navegador? Faça um backup antes.')){localStorage.removeItem(K);useLocal();toast('Dados locais apagados.')}return}
}catch(error){console.error(error);toast(error.message||'Operação não concluída.',true)}
}
async function handleSubmit(e){const form=e.target;e.preventDefault();try{if(form.id==='modal-form'){if(form.dataset.form==='record')await submitRecord(form);else if(form.dataset.form!=='none')await submitSmall(form);else closeModal();render();toast('Registro atualizado.')}if(form.id==='settings-form')await submitSettings(form);if(form.id==='auth-form')await authSubmit(form)}catch(error){console.error(error);toast(error.message||'Não foi possível salvar.',true)}}
function handleChange(e){if(e.target.id==='period-input'){S.period=e.target.value||currentMonth();render()}if(e.target.id==='workspace-select')switchWorkspace(e.target.value).catch(e=>toast(e.message,true));if(['simulation-value','simulation-months'].includes(e.target.id))updateSimulation()}
let searchCursor=0;
function handleInput(e){if(e.target.id==='search-input'){S.search=e.target.value;searchCursor=e.target.selectionStart;render();const input=$('#search-input');if(input){input.focus();input.setSelectionRange(searchCursor,searchCursor)}}if(e.target.id==='simulation-value')updateSimulation()}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('change',handleChange);document.addEventListener('input',handleInput);
initialize().catch(e=>{console.error(e);useLocal();toast('Falha ao iniciar; dados locais carregados.',true)});

</script>
</body>
